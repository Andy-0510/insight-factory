name: Monthly Report Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 21 27 * *" # 매월 27일 21:00 UTC = 다음날 06:00 KST (월말에 실행)
  workflow_dispatch:

jobs:
  build_monthly_report:
    runs-on: ubuntu-latest
    env:
      USE_PRO: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HOME: ~/.cache/huggingface
      MONTHLY_RUN: "true" # 👈 월간 실행 모드 활성화

    steps:
      # --- 체크아웃, 캐시, 의존성 설치 ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
          
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hfmodels
          restore-keys: |
            ${{ runner.os }}-hfmodels
            
      - name: Install dependencies & Fonts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-noto-cjk
          fc-cache -f

      - name: Download spaCy Korean model  # <-- 새로운 단계 추가
        run: |
          python -m spacy download ko_core_news_sm
        shell: bash

      - name: 🚀 Start Monthly Pipeline
        run: |
          echo "=================================================="
          echo "✅ 월간 파이프라인을 시작합니다."
          echo "실행 시간 (KST): $(TZ=Asia/Seoul date)"
          echo "PRO 모드 활성화: ${{ env.USE_PRO }}"
          echo "MONTHLY_RUN: true"
          echo "=================================================="
      
      # --- 월간 리포트에 필요한 모든 모듈 실행 ---

      - name: Aggregate Monthly Data (keywords.json, events.csv, weak_signals.csv, trend_strength.csv, news_meta_agg.json)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"
        run: |
          python -m scripts.aggregate_monthly_data

      - name: Keywords Analysis
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"
        run: |
          python -m src.module_b

      - name: Topics Analysis / Stable Timeseries calculation / Insight (Only Weekly&Monthly)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"
        run: |
          python -m src.module_c

      - name: Signals Export (Event, Trend_strength, Weak_signals)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m scripts.signal_export

      - name: calculate topic growth
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m scripts.calculate_topic_growth

      # --- ▼▼▼ 이 단계를 여기에 추가 ▼▼▼ ---
      - name: Enrich Topics (Interest + Positivity + Activity)
        shell: bash
        env:
          MONTHLY_RUN: "true"
        run: |
          python -m scripts.enrich_monthly_topics
      # --- ▲▲▲ 추가 완료 ▲▲▲ ---

      - name: Company Analysis (Topic Matrix, Relationship, Competition Network)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m src.module_d

      - name: Biz Oppourtunities and Scoring
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m src.module_e

      - name: Future Insights (Analysis tech maturity, weak signal insight)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m scripts.future_insights

      - name: Risk Analysis
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m src.module_g_risk

      - name: Action Plan
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m src.module_h_planning

      - name: Generate Monthly Visuals
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTHLY_RUN: "true"        
        run: |    
          python -m scripts.generate_visuals --report-type monthly

    #  - name: Generate Monthly Report
    #    shell: bash
    #    env:
    #      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    #      MONTHLY_RUN: "true"        
    #    run: |    
    #      python -m src.module_f.monthly_report

    #  - name: Generate Monthly Detailed Commentary Report
    #    shell: bash
    #    env:
    #      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    #      MONTHLY_RUN: "true"        
    #    run: |
    #      python -m src.module_f.monthly_commentary_report

      # --- ▼▼▼ 월간 HTML 리포트 생성 단계 추가 ▼▼▼ ---
      - name: Generate Monthly HTML Report
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # LLM 사용하므로 API 키 전달
          MONTHLY_RUN: "true"
        run: |
          python -m scripts.generate_monthly_html_report
      # --- ▲▲▲ 월간 HTML 리포트 생성 단계 추가 완료 ▲▲▲ ---

      - name: 📝 Log Monthly Results
        if: always()
        run: |
          echo "=================================================="
          echo "🏁 월간 파이프라인 실행 결과 요약"
          echo "=================================================="
          echo "- 집계된 기사 수: $(jq 'length' outputs/debug/monthly_meta_agg.json || echo 'N/A')"
          echo "- 신사업 아이디어 수: $(jq '.ideas | length' outputs/biz_opportunities.json || echo 'N/A')"
          echo "- 탐지된 리스크 수: $( (wc -l < outputs/export/risk_issues.csv 2>/dev/null || echo 1) | xargs -I {} expr {} - 1 )"
          echo "- 제안된 실행 계획 수: $( (wc -l < outputs/export/two_week_plan.csv 2>/dev/null || echo 1) | xargs -I {} expr {} - 1 )"
          echo "- 생성된 리포트: $(ls -1 outputs/monthly_report.md || echo '생성 실패')"
          echo "=================================================="
      
       # 일자별 아카이브(KST)
      - name: Prepare outputs monthly folder (KST)
        shell: bash
        run: |
          set -e
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          TIME_KST=$(TZ=Asia/Seoul date +'%H%M-KST')
          OUTDIR="outputs/monthly/${DATE_KST}/${TIME_KST}"
          mkdir -p "${OUTDIR}/fig" "${OUTDIR}/debug" "${OUTDIR}/export"

          # 기본 결과 파일 복사 (json, html, md)
          cp outputs/*.json             "${OUTDIR}/" || true
          cp outputs/*.html             "${OUTDIR}/" || true
          cp outputs/*.md               "${OUTDIR}/" || true
          
          # 서브폴더 내용 전체 복사 (export, fig, debug)
          if [ -d outputs/export ]; then
            cp -r outputs/export/* "${OUTDIR}/export/" || true
          fi
          if [ -d outputs/fig ]; then
            cp -r outputs/fig/* "${OUTDIR}/fig/" || true
          fi
          if [ -d "outputs/debug" ]; then
            rsync -a --exclude='monthly_meta_agg.json' outputs/debug/ "${OUTDIR}/debug/" || true
          fi

          echo "OUTDIR=${OUTDIR}" >> $GITHUB_ENV

        #  monthly_meta_agg.json > 100 MB
        #  if [ -d outputs/debug ]; then
        #   cp -r outputs/debug/* "${OUTDIR}/debug/" || true
        #  fi
          
      # outputs 커밋/푸시
      - name: Archive and Commit Monthly Report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/monthly
          git commit -m "chore: outputs (KST rotation)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      # --- ▼▼▼ 리포트 인덱스 생성 단계 추가 ▼▼▼ ---
      - name: Generate Report Index
        run: |
          python scripts/generate_report_index.py # 위에서 작성한 스크립트 실행
        shell: bash

      - name: Commit Report Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true # 충돌 방지
          git add report_index.json # 생성된 인덱스 파일 추가
          git commit -m "chore: update report index" || echo "no changes to report index"
          git push origin HEAD:${{ github.ref_name }} || true # 푸시 실패해도 워크플로우 중단 방지
        shell: bash
      # --- ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ ---
