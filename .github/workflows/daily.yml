name: Daily Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00
  workflow_dispatch:

concurrency:
  group: daily-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      USE_PRO: 'true' # 일간 작업은 PRO 모드 비활성화 권장
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HOME: ~/.cache/huggingface

    steps:
      # --- 체크아웃, 캐시, 의존성 설치 ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hfmodels
          restore-keys: |
            ${{ runner.os }}-hfmodels
            
      - name: Install dependencies & Fonts
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-noto-cjk
          fc-cache -f

      - name: Download spaCy Korean model  # <-- 새로운 단계 추가
        run: |
          python -m spacy download ko_core_news_sm
        shell: bash

      - name: 🚀 Start Daily Pipeline
        run: |
          echo "=================================================="
          echo "✅ 일간 파이프라인을 시작합니다."
          echo "실행 시간 (KST): $(TZ=Asia/Seoul date)"
          echo "PRO 모드 활성화: ${{ env.USE_PRO }}"
          echo "=================================================="

      # --- 일일 데이터 처리 및 분석 모듈 ---
      - name: News scrap
        shell: bash
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python -m src.module_a

      - name: warehouse append
        shell: bash
        run: |
          python -m src.warehouse_append

      - name: Commit & Push Warehouse (news_meta_*.json)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/warehouse
          git commit -m "chore: warehouse append (daily)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Fetch article bodies
        shell: bash
        run: |
          python -m scripts.fetch_article_bodies

      - name: Copy latest meta file for debugging
        shell: bash
        run: |
          set -e
          mkdir -p outputs/debug
          LATEST_META=$(ls -t data/news_meta_*.json | head -n 1)
          if [ -f "$LATEST_META" ]; then
            echo "Copying $LATEST_META to outputs/debug/news_meta_latest.json"
            cp "$LATEST_META" outputs/debug/news_meta_latest.json
          else
            echo "WARN: No news_meta_*.json file found to copy."
          fi

      - name: Keywords Analysis
        shell: bash
        run: |
          python -m src.module_b

      - name: Topics Analysis / Stable Timeseries calculation / Insight (Only Weekly&Monthly)
        shell: bash
        run: |
          python -m src.module_c

      - name: Sentiment Analysis
        shell: bash
        run: |    
          python -m scripts.calculate_daily_sentiment

      - name: Signals Export (Event, Trend_strength, Weak_signals, daily_hot_signals)
        shell: bash
        run: |    
          python -m scripts.signal_export

      - name: Select TOP Articles (today_article_list, daily_signal_counts)
        shell: bash
        run: |    
          python -m scripts.select_top_articles

      # --- 일간 리포트 생성 ---
      - name: Generate Daily Visuals
        shell: bash
        run: |
          python -m scripts.generate_visuals --report-type daily

    # --- 리포트 Ver.1 ---
    #  - name: Generate Daily Report
    #    shell: bash
    #    run: |
    #      python -m src.module_f.daily_report
    
    # --- 리포트 Ver.2 ---
    #  - name: Generate Daily Detailed Commentary Report
    #    shell: bash
    #    run: |
    #      python -m src.module_f.daily_commentary_report

    # --- 리포트 Ver.3 ---
      - name: Generate Daily HTML Report
        shell: bash
        run: |
          python -m scripts.generate_daily_html_report

      - name: Log Daily Results
        if: always() # 이전 단계가 실패해도 항상 실행
        run: |
          echo "=================================================="
          echo "🏁 일간 파이프라인 실행 결과 요약"
          echo "=================================================="
          echo "- 수집된 기사 수: $(jq 'length' data/news_meta_*.json | head -n 1 || echo 'N/A')"
          echo "- 추출된 키워드 수: $(jq '.keywords | length' outputs/keywords.json || echo 'N/A')"
          echo "- 생성된 토픽 수: $(jq '.topics | length' outputs/topics.json || echo 'N/A')"
          echo -e "- 생성된 export 파일 목록:\n$(ls -1 outputs/export || echo '  - 내역 없음')"
          echo "=================================================="
              
      # 일자별 아카이브(KST)
      - name: Prepare outputs daily folder (KST)
        shell: bash
        run: |
          set -e
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          TIME_KST=$(TZ=Asia/Seoul date +'%H%M-KST')
          OUTDIR="outputs/daily/${DATE_KST}/${TIME_KST}"
          mkdir -p "${OUTDIR}/fig" "${OUTDIR}/debug" "${OUTDIR}/export"

          # 기본 결과 파일 복사 (json, html, md)
          cp outputs/*.json             "${OUTDIR}/" || true
          cp outputs/*.html             "${OUTDIR}/" || true
          cp outputs/*.md               "${OUTDIR}/" || true

          # news_meta_latest.json 복사
          latest_file=$(ls -1t data/news_meta_*.json 2>/dev/null | head -n 1)
          if [ -n "$latest_file" ]; then
            echo "Copying $latest_file to outputs/debug/news_meta_latest.json"
            cp "$latest_file" "${OUTDIR}/debug/news_meta_latest.json"
          else
            echo "WARN: No news_meta_*.json file found to copy."
          fi   

          # 서브폴더 내용 전체 복사 (export, fig, debug)
          if [ -d outputs/export ]; then
            cp -r outputs/export/* "${OUTDIR}/export/" || true
          fi

          # 서브폴더 내용 전체 복사 (export, fig, debug)
          if [ -d outputs/export ]; then
            cp -r outputs/export/* "${OUTDIR}/export/" || true
          fi
          if [ -d outputs/fig ]; then
            cp -r outputs/fig/* "${OUTDIR}/fig/" || true
          fi
          if [ -d outputs/debug ]; then
            cp -r outputs/debug/* "${OUTDIR}/debug/" || true
          fi
          
          echo "OUTDIR=${OUTDIR}" >> $GITHUB_ENV

      # outputs 커밋/푸시
      - name: Archive and Commit daily Report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/daily
          git commit -m "chore: outputs (KST rotation)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      # --- ▼▼▼ 리포트 인덱스 생성 단계 추가 ▼▼▼ ---
      - name: Generate Report Index
        run: |
          python scripts/generate_report_index.py 
        shell: bash

      - name: Commit Report Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true # 충돌 방지
          git add report_index.json # 생성된 인덱스 파일 추가
          git commit -m "chore: update report index" || echo "no changes to report index"
          git push origin HEAD:${{ github.ref_name }} || true # 푸시 실패해도 워크플로우 중단 방지
        shell: bash
      # --- ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ ---

      # 오래된 outputs/warehouse 정리
      - name: Cleanup old warehouse (main only, keep 90 days)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -e
          test -d data/warehouse || exit 0
          find data/warehouse -type f -daystart -mtime +90 -print -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/warehouse
          git commit -m "chore: cleanup old warehouse (>90d)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Cleanup old outputs (main only, keep 90 days)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -e
          test -d outputs/daily || exit 0
          find outputs/daily -mindepth 1 -maxdepth 1 -type d -daystart -mtime +90 -print -exec rm -rf {} \; || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/daily
          git commit -m "chore: cleanup old outputs (>90d)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
