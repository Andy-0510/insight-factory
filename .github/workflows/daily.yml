name: Daily Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00
  workflow_dispatch:

concurrency:
  group: daily-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      USE_PRO: 'false' # 일간 작업은 PRO 모드 비활성화 권장
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HOME: ~/.cache/huggingface

    steps:
      # --- 체크아웃, 캐시, 의존성 설치 ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hfmodels
          restore-keys: |
            ${{ runner.os }}-hfmodels
            
      - name: Install dependencies & Fonts
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 🚀 Start Daily Pipeline
        run: |
          echo "=================================================="
          echo "✅ 일간 파이프라인을 시작합니다."
          echo "실행 시간 (KST): $(TZ=Asia/Seoul date)"
          echo "PRO 모드 활성화: ${{ env.USE_PRO }}"
          echo "=================================================="

      - name: Preflight | Check secrets
        run: |
          test -n "${{ secrets.GEMINI_API_KEY }}" || (echo "GEMINI_API_KEY 없음"; exit 1)
          if [ -z "${{ secrets.NAVER_CLIENT_ID }}" ] || [ -z "${{ secrets.NAVER_CLIENT_SECRET }}" ]; then
            echo "[WARN] NAVER API 키가 없습니다."
          fi

      # --- 일일 데이터 처리 및 분석 모듈 ---
      - name: 📊 Run Daily Data Processing
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo -e "\n---  STEP 1: 데이터 수집 및 준비 ---"
          python -m src.module_a
          python -m src.warehouse_append
          python -m scripts.fetch_article_bodies

          echo -e "\n--- STEP 2: 핵심 데이터 분석 ---"
          python -m src.module_b
          python -m src.module_c
          python -m scripts.calculate_daily_sentiment

          echo -e "\n--- STEP 3: 신호 추출 및 기사 선정 ---"
          python -m scripts.signal_export
          python -m scripts.select_top_articles

          echo "✅ 모든 데이터 처리 모듈 실행 완료"

      # --- 일간 리포트 생성 ---
      - name: 🎨 Generate Daily Visuals & Report
        run: |
          echo -e "\n--- STEP 4: 시각화 자료 및 리포트 생성 ---"
          python -m scripts.generate_visuals --report-type daily
          python -m src.module_f.daily_report
          echo "✅ 리포트 생성 완료"

      - name: 📝 Log Daily Results
        if: always() # 이전 단계가 실패해도 항상 실행
        run: |
          echo "=================================================="
          echo "🏁 일간 파이프라인 실행 결과 요약"
          echo "=================================================="
          echo "- 수집된 기사 수: $(jq 'length' data/news_meta_*.json | head -n 1 || echo 'N/A')"
          echo "- 추출된 키워드 수: $(jq '.keywords | length' outputs/keywords.json || echo 'N/A')"
          echo "- 생성된 토픽 수: $(jq '.topics | length' outputs/topics.json || echo 'N/A')"
          echo -e "- 생성된 export 파일 목록:\n$(ls -1 outputs/export || echo '  - 내역 없음')"
          echo "=================================================="
              
       # 일자별 아카이브(KST)
      - name: 💾 Finalize, Archive and Commit All Outputs
        run: |
          set -e
          
          # --- 1. 그날의 아카이브 폴더 경로 정의 ---
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          TIME_KST=$(TZ=Asia/Seoul date +'%H%M-KST')
          OUTDIR="outputs/daily/${DATE_KST}/${TIME_KST}"
          
          # --- 2. Git 사용자 설정 ---
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # --- 3. 커밋할 대상들을 정확히 지정하여 추가 ---
          # (이 단계에서는 아직 로컬에만 파일이 복사된 상태가 아님)
          # (따라서 커밋 대상은 원본 경로를 사용)
          git add "data/warehouse/" # 웨어하우스 변경사항
          git add "outputs/"      # 오늘 생성된 모든 결과물
          
          # --- 4. 단일 커밋 및 푸시 ---
          git commit -m "docs(daily): update report and data for ${DATE_KST}" || echo "No changes to commit"
          git pull --rebase
          git push

          # --- 5. 커밋 후, 아카이빙을 위해 로컬 파일 정리 및 복사 ---
          # (이 단계는 다음 실행을 위한 것이 아니라, 아카이브 구조를 만들기 위함)
          # 이 부분은 현재 워크플로우의 "Prepare outputs daily folder" 와 동일한 역할을 합니다.
          # 단, 커밋은 이미 위에서 완료되었습니다.
          mkdir -p "${OUTDIR}/fig" "${OUTDIR}/export" "${OUTDIR}/debug"
          mv outputs/*.json             "${OUTDIR}/" || true
          mv outputs/*.html             "${OUTDIR}/" || true
          mv outputs/*.md               "${OUTDIR}/" || true
          mv outputs/export/* "${OUTDIR}/export/" || true
          mv outputs/fig/* "${OUTDIR}/fig/" || true
          mv outputs/debug/* "${OUTDIR}/debug/" || true

      # 오래된 outputs/warehouse 정리
      - name: Cleanup old warehouse (main only, keep 90 days)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -e
          test -d data/warehouse || exit 0
          find data/warehouse -type f -daystart -mtime +90 -print -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/warehouse
          git commit -m "chore: cleanup old warehouse (>90d)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Cleanup old outputs (main only, keep 90 days)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -e
          test -d outputs/daily || exit 0
          find outputs/daily -mindepth 1 -maxdepth 1 -type d -daystart -mtime +90 -print -exec rm -rf {} \; || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/daily
          git commit -m "chore: cleanup old outputs (>90d)" || echo "no changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true