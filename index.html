<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Intelligence Report Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <header>
      <div class="title">
        <div>
          <h1>Intelligence Report Viewer</h1>
        </div>
      </div>

      <div class="theme-switch-wrapper" aria-hidden="false">
        <div id="themeToggle" class="toggle" role="switch" aria-checked="false" tabindex="0" title="다크 모드 토글"></div>
        <div id="themeText">라이트</div>
      </div>
    </header>

    <nav class="controls-row" aria-label="report controls">
      <div class="controls-inner">
        <div class="control" style="min-width:180px;">
          <label for="reportType">리포트 종류</label>
          <select id="reportType" aria-label="리포트 종류">
            <option value="daily">일간</option>
            <option value="weekly">주간</option>
            <option value="monthly">월간</option>
          </select>
        </div>

        <div class="control">
          <label for="reportYear">연도</label>
          <select id="reportYear" aria-label="연도"></select>
        </div>

        <div class="control">
          <label for="reportMonth">월</label>
          <select id="reportMonth" aria-label="월"></select>
        </div>

        <div class="control">
          <label for="reportDay">일</label>
          <select id="reportDay" aria-label="일"></select>
        </div>
      </div>
    </nav>

    <main class="report-view">
      <div class="loading" id="loadingIndicator" style="display:none">
        <div class="spinner" aria-hidden="true"></div>
        <div>리포트 로딩 중...</div>
      </div>

      <div class="viewer" aria-live="polite">
        <iframe id="reportFrame" src="about:blank" title="Report Content"></iframe>
      </div>
    </main>

    <footer>
      <div>&copy; Business Development Team</div>
    </footer>
  </div>
  
      <button class="chatbot-toggle-button" id="chatbot-toggle-btn">
        💬
    </button>

    <div class="chatbot-container" id="chatbot-window">

        <div class="chatbot-header">
            AI 어시스턴트
            <button class="chatbot-close-btn" id="chatbot-close-btn">X</button>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                안녕하세요😀 인텔리전스 리포트 AI 어시스턴트입니다. 
                현재 보고 계신 리포트의 내용을 기반으로 요약, 분석, 추가 질문이 가능합니다.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="여기에 질문을 입력하세요...">
            <button id="chat-send-btn">전송</button>
        </div>
    </div>


  <script src="script.js"></script>
</body>
</html>
