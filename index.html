<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Intelligence Report Viewer</title>

  <!-- Google Fonts(Pretendard) 요청에서 400 에러 발생하므로 주석 처리함.
       필요하면 Pretendard를 로컬에 호스팅하거나 공식 CDN으로 교체하세요. -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&display=swap" rel="stylesheet"> -->

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="app">
    <header>
      <div class="title">
        <h1>Intelligence Report Viewer</h1>
      </div>

      <div class="theme-switch-wrapper" aria-hidden="false">
        <div id="themeToggle" class="toggle" role="switch" aria-checked="false" tabindex="0" title="다크 모드 토글"></div>
        <div id="themeText">라이트</div>
      </div>
    </header>

    <nav class="controls-row" aria-label="report controls">
      <div class="controls-inner">
        <div class="control type-control">
          <label for="reportType">리포트 종류</label>
          <select id="reportType" aria-label="리포트 종류">
            <option value="daily">일간</option>
            <option value="weekly">주간</option>
            <option value="monthly">월간</option>
          </select>
        </div>

        <div class="control small">
          <label for="reportYear">연도</label>
          <select id="reportYear" aria-label="연도"></select>
        </div>

        <div class="control small">
          <label for="reportMonth">월</label>
          <select id="reportMonth" aria-label="월"></select>
        </div>

        <div class="control small">
          <label for="reportDay">일</label>
          <select id="reportDay" aria-label="일"></select>
        </div>
      </div>
    </nav>

    <main class="report-view">
      <div class="loading" id="loadingIndicator" style="display:none">
        <div class="spinner" aria-hidden="true"></div>
        <div>리포트 로딩 중...</div>
      </div>

      <div class="viewer" aria-live="polite">
        <div id="reportContainer" class="report-container"></div>
      </div>
    </main>

    <footer>
      <div>&copy; Business Development Team</div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
